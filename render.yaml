services:
  - type: web
    name: ditc
    runtime: node
    plan: free
    buildCommand: >-
      npm install &&
      node scripts/prebuild.mjs &&
      npx prisma db push &&
      npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ditc-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: AI_ASK_PER_HOUR
        value: 10
      - key: NODE_VERSION
        value: 20.17.0

databases:
  - name: ditc-db
    plan: free
